<mat-card class="product-card">
  <img mat-card-image [src]="product.imageUrl" alt="Product">

  <mat-card-content>
    <h3>{{ product.name }}</h3>
    <p>{{ product.price | currency }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary">
      Add to Cart
    </button>
  </mat-card-actions>
</mat-card>
